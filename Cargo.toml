[package]
name = "img_coords"
version = "0.2.1"
edition = "2024"
description = "Rust binary to scan a directory tree for images and collect their coordinates from EXIF"
license = "MIT"
repository = "https://github.com/magnusmanske/img_coords"
keywords = ["cli", "EXIF", "coordinates", "gps", "images"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
kamadak-exif = "0.5"
serde_json = "1"
serde = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
geojson = "0.24"
kml = "0.8"
jwalk = "0.8"
rayon = "1"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
base64 = "0.21"

[profile.release]
lto = 'thin'
codegen-units = 1
#panic = 'abort'
